<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10201d" />
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Breeze Elf</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --ink: #14211f;
        --muted: #5d6b67;
        --line: #ccd5d2;
        --panel: #ffffff;
        --live: #087f5b;
        --warn: #b7791f;
        --danger: #b42318;
        --accent: #2454a6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
      }

      .shell {
        width: min(900px, 100%);
        min-height: 100svh;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 14px;
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        line-height: 1.1;
        font-weight: 760;
      }

      .status {
        min-width: 5.5rem;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
        font-weight: 680;
      }

      .status.live {
        color: var(--live);
        border-color: color-mix(in srgb, var(--live), white 65%);
      }

      .status.error {
        color: var(--danger);
        border-color: color-mix(in srgb, var(--danger), white 60%);
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 10px;
      }

      button {
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-weight: 740;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--live);
        background: var(--live);
        color: white;
      }

      button.danger {
        border-color: color-mix(in srgb, var(--danger), white 55%);
        color: var(--danger);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .transcript {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        display: grid;
        grid-template-rows: auto 1fr auto;
        overflow: hidden;
      }

      .bar {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 680;
      }

      #lines {
        min-height: 260px;
        overflow: auto;
        padding: 18px 16px 24px;
        font-size: 1.22rem;
        line-height: 1.65;
        white-space: pre-wrap;
      }

      #lines:empty::before {
        content: " ";
      }

      .partial {
        min-height: 54px;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        color: var(--accent);
        font-size: 1rem;
        line-height: 1.45;
      }

      .partial:empty::before {
        content: " ";
      }

      footer {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      @media (max-width: 520px) {
        .shell {
          gap: 12px;
          padding-inline: 12px;
        }

        .controls {
          grid-template-columns: 1fr 1fr;
        }

        #clear {
          grid-column: 1 / -1;
        }

        #lines {
          font-size: 1.12rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <img class="brand-mark" src="/static/favicon.svg" width="42" height="42" alt="" />
          <h1>Breeze Elf</h1>
        </div>
        <div id="status" class="status">待命</div>
      </header>

      <section class="controls" aria-label="controls">
        <button id="start" class="primary" type="button">▶ 開始</button>
        <button id="stop" class="danger" type="button" disabled>■ 停止</button>
        <button id="clear" type="button">清除</button>
      </section>

      <section class="transcript" aria-label="transcript">
        <div class="bar">
          <span>即時</span>
          <span id="stats">0 ms</span>
        </div>
        <div id="lines"></div>
        <div id="partial" class="partial"></div>
      </section>

      <footer>
        <span id="backend">ASR</span>
        <span id="clock">00:00</span>
      </footer>
    </main>

    <script src="/static/app.js" type="module"></script>
  </body>
</html>
