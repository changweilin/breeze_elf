<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f8" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Breeze Elf</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("breeze-elf-theme");
          const theme =
            stored === "dark" || stored === "light"
              ? stored
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.querySelector("meta[name='theme-color']").content =
            theme === "dark" ? "#111614" : "#f6f7f8";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f8;
        --ink: #14211f;
        --muted: #5d6b67;
        --line: #ccd5d2;
        --panel: #ffffff;
        --panel-subtle: #eef3f1;
        --live: #087f5b;
        --live-contrast: #ffffff;
        --live-soft: #a9d9c9;
        --warn: #b7791f;
        --warn-contrast: #ffffff;
        --danger: #b42318;
        --danger-soft: #e7b2ad;
        --accent: #2454a6;
        --button-hover: #eef3f1;
        --shadow: rgba(20, 33, 31, 0.08);
        --theme-color: #f6f7f8;
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #111614;
        --ink: #ecf2ef;
        --muted: #a4b1ad;
        --line: #34433f;
        --panel: #1b2421;
        --panel-subtle: #24312d;
        --live: #41c999;
        --live-contrast: #071411;
        --live-soft: #245c49;
        --warn: #e2b45e;
        --warn-contrast: #1d1304;
        --danger: #ff8a80;
        --danger-soft: #6f3732;
        --accent: #91b8ff;
        --button-hover: #24312d;
        --shadow: rgba(0, 0, 0, 0.28);
        --theme-color: #111614;
      }

      * {
        box-sizing: border-box;
      }

      html {
        height: 100%;
        overflow: hidden;
      }

      body {
        margin: 0;
        height: 100svh;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        letter-spacing: 0;
        transition:
          background-color 160ms ease,
          color 160ms ease;
      }

      .shell {
        width: min(900px, 100%);
        height: 100svh;
        min-height: 0;
        margin: 0 auto;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto auto;
        gap: 14px;
        padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        flex: 0 0 auto;
      }

      h1 {
        margin: 0;
        font-size: 1.35rem;
        line-height: 1.1;
        font-weight: 760;
      }

      .status {
        min-width: 5.5rem;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
        font-weight: 680;
        flex: 0 0 auto;
      }

      .status.live {
        color: var(--live);
        border-color: var(--live-soft);
      }

      .status.error {
        color: var(--danger);
        border-color: var(--danger-soft);
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      button {
        min-width: 0;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--ink);
        font: inherit;
        font-weight: 740;
        cursor: pointer;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
        transition:
          background-color 140ms ease,
          border-color 140ms ease,
          color 140ms ease;
      }

      button:hover:not(:disabled) {
        background: var(--button-hover);
      }

      button.primary {
        border-color: var(--live);
        background: var(--live);
        color: var(--live-contrast);
      }

      button.primary:hover:not(:disabled) {
        background: var(--live);
      }

      button.danger {
        border-color: var(--danger-soft);
        color: var(--danger);
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .theme-toggle {
        width: 42px;
        min-width: 42px;
        min-height: 42px;
        padding: 0;
        display: inline-grid;
        place-items: center;
        font-size: 1.08rem;
        line-height: 1;
      }

      .transcript {
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        overflow: hidden;
        box-shadow: 0 1px 2px var(--shadow);
      }

      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 11px 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.88rem;
        font-weight: 680;
      }

      .bar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        flex: 1;
        justify-content: flex-end;
      }

      .mini {
        min-width: 5rem;
        min-height: 34px;
        padding: 0 10px;
        font-size: 0.84rem;
        font-weight: 720;
      }

      #pitch {
        position: relative;
        z-index: 1;
      }

      #pitch[aria-pressed="true"],
      .mini.active {
        border-color: var(--warn);
        color: var(--warn-contrast);
        background: var(--warn);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn-contrast) 24%, transparent);
      }

      #pitch[aria-pressed="true"]:hover:not(:disabled),
      .mini.active:hover:not(:disabled) {
        background: var(--warn);
      }

      #lines {
        min-height: 0;
        overflow: auto;
        overscroll-behavior: contain;
        padding: 18px 16px 24px;
        font-size: 1.22rem;
        line-height: 1.65;
        white-space: pre-wrap;
      }

      #lines:empty::before {
        content: " ";
      }

      #lines.pitch-mode {
        display: flex;
        flex-direction: column;
        gap: 2px;
        white-space: normal;
      }

      .transcript-block {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 8px 12px;
        padding: 10px 0 12px;
        border-bottom: 1px solid var(--line);
      }

      .transcript-block:last-child {
        border-bottom: 0;
      }

      .transcript-text {
        min-width: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .pitch-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.3;
        white-space: nowrap;
      }

      .pitch-value {
        color: var(--warn);
        font-weight: 780;
      }

      .pitch-spark {
        grid-column: 1 / -1;
        height: 28px;
        display: flex;
        align-items: end;
        gap: 2px;
        overflow: hidden;
      }

      .pitch-spark > span {
        width: 4px;
        min-width: 2px;
        max-width: 8px;
        height: var(--pitch-height);
        border-radius: 2px 2px 0 0;
        background: var(--warn);
        opacity: 0.72;
      }

      .pitch-spark.empty {
        height: 4px;
        align-self: center;
        border-radius: 999px;
        background: var(--panel-subtle);
      }

      .partial {
        min-height: 54px;
        max-height: 22svh;
        overflow: auto;
        padding: 12px 16px;
        border-top: 1px solid var(--line);
        color: var(--accent);
        font-size: 1rem;
        line-height: 1.45;
      }

      .partial:empty::before {
        content: " ";
      }

      .recording {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        box-shadow: 0 1px 2px var(--shadow);
      }

      .recording[hidden] {
        display: none;
      }

      .recording audio {
        width: 100%;
        min-width: 0;
        height: 38px;
      }

      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .footer-meta {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }

      #backend {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .meter {
        width: 72px;
        min-width: 72px;
        height: 8px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--panel-subtle);
      }

      .meter > span {
        display: block;
        width: 100%;
        height: 100%;
        transform: scaleX(0);
        transform-origin: left center;
        background: var(--live);
        transition: transform 120ms ease;
      }

      @media (max-width: 520px) {
        .shell {
          gap: 12px;
          padding-inline: 12px;
        }

        .controls {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 8px;
        }

        #lines {
          font-size: 1.12rem;
        }

        .bar {
          align-items: flex-start;
          flex-direction: column;
        }

        .bar-actions {
          display: grid;
          grid-template-columns: repeat(4, minmax(0, 1fr));
          width: 100%;
        }

        .bar-actions > * {
          min-width: 0;
        }

        #stats {
          grid-column: 1 / -1;
          min-width: 0;
          overflow-wrap: anywhere;
        }

        .mini {
          width: 100%;
          min-width: 0;
        }

        .transcript-block {
          grid-template-columns: minmax(0, 1fr);
        }

        .recording {
          grid-template-columns: minmax(0, 1fr);
        }

        #audio-download {
          width: 100%;
        }

        .pitch-meta {
          justify-content: flex-start;
          white-space: normal;
        }
      }

      @media (max-width: 360px) {
        .brand-mark {
          width: 36px;
          height: 36px;
        }

        h1 {
          font-size: 1.18rem;
        }

        .status {
          min-width: 4.5rem;
          padding-inline: 8px;
        }

        .theme-toggle {
          width: 38px;
          min-width: 38px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <div class="brand">
          <img class="brand-mark" src="./favicon.svg" width="42" height="42" alt="" />
          <h1>Breeze Elf</h1>
        </div>
        <div class="header-actions">
          <button id="theme" class="theme-toggle" type="button" aria-label="切換深色模式" aria-pressed="false" title="切換深色模式">☾</button>
          <div id="status" class="status">待命</div>
        </div>
      </header>

      <section class="controls" aria-label="controls">
        <button id="start" class="primary" type="button">▶ 開始</button>
        <button id="stop" class="danger" type="button" disabled>■ 停止</button>
        <button id="clear" type="button">清除</button>
      </section>

      <section class="transcript" aria-label="transcript">
        <div class="bar">
          <span>即時</span>
          <div class="bar-actions">
            <span id="stats">0 ms</span>
            <button id="pitch" class="mini" type="button" aria-pressed="false" aria-label="顯示音高模式" title="顯示每段文字的音高">音高</button>
            <button id="copy" class="mini" type="button" disabled>複製</button>
            <button id="download" class="mini" type="button" disabled>下載</button>
            <button id="save" class="mini" type="button" disabled>遠端儲存</button>
          </div>
        </div>
        <div id="lines"></div>
        <div id="partial" class="partial"></div>
      </section>

      <section id="audio-panel" class="recording" aria-label="錄音" hidden>
        <audio id="recording" controls preload="metadata"></audio>
        <button id="audio-download" class="mini" type="button" disabled aria-label="下載錄音音檔" title="下載錄音音檔">音檔</button>
      </section>

      <footer>
        <div class="footer-meta">
          <span id="backend">ASR</span>
          <span class="meter" aria-label="microphone level"><span id="level"></span></span>
        </div>
        <span id="clock">00:00</span>
      </footer>
    </main>

    <script src="./app.js?v=11" type="module"></script>
  </body>
</html>
