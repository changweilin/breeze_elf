name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Same checks as a pull request, by construction - see verify.yml.
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      python-version: "3.11"
      build: false

  publish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        run: uv build

      # The wheel force-includes web/ (see pyproject). Shipping one without the frontend
      # produces an installable package that serves 404s, so check before publishing.
      - name: Check the wheel ships the frontend
        run: |
          python - <<'PY'
          import pathlib, sys, zipfile
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel built")
          names = set(zipfile.ZipFile(wheels[-1]).namelist())
          required = [
              "breeze_elf/web/index.html",
              "breeze_elf/web/app.js",
              "breeze_elf/web/service-worker.js",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              sys.exit(f"wheel is missing frontend assets: {missing}")
          print(f"{wheels[-1].name} ships the frontend")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: breeze-elf-dist
          path: dist/*
          if-no-files-found: error
