name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same branch; main is never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # pyproject declares requires-python >=3.11, so every supported version must pass.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    uses: ./.github/workflows/verify.yml
    with:
      python-version: ${{ matrix.python-version }}
      # One wheel build is enough; the packaging config does not vary by interpreter.
      build: ${{ matrix.python-version == '3.11' }}

  web-cache-bump:
    # Hard rule: a changed web asset that keeps its old cache version makes installed
    # PWAs load a fresh module against a stale dependency, which fails silently.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check cache versions were bumped
        run: python tools/check_web_bump.py --base "origin/${{ github.base_ref }}"
