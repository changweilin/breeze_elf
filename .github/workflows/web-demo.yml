name: Web Demo

# Publishes web/ to GitHub Pages as the no-backend demo. Syntax and cache-version checks
# are not repeated here - CI already runs them on the pull request that produced this
# commit, and a third copy would just be another place to forget to update.

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/web-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
