[project]
name = "breeze-elf"
version = "0.1.0"
description = "Phone microphone streaming over Tailscale to local ASR."
readme = "README.md"
# onnxruntime — a core faster-whisper dependency — stopped publishing cp310
# wheels at 1.24, so a 3.10 lock cannot be installed at all.
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
# Neural speech enhancement (DeepFilterNet3) + music source separation (Demucs).
# torch/torchaudio must match the local CUDA — on this RTX 3060 box install with
# the CUDA wheel index first, e.g.:
#   uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124
#   uv pip install deepfilternet demucs
enhance = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "deepfilternet>=0.5.6",
    "demucs>=4.0.1",
]
# Post-recognition translation (NLLB-200, CC-BY-NC-4.0 — non-commercial, opt-in).
# ctranslate2 + huggingface-hub already ship with faster-whisper, so this adds only
# the lightweight sentencepiece tokenizer. The CT2-converted NLLB model must be
# fetched into a local dir separately (offline-first — never downloaded on demand).
translate = [
    "sentencepiece>=0.2.0",
]
# Anonymous in-session speaker diarization. onnxruntime already ships with
# faster-whisper (for Silero VAD); it is pinned here to make the dependency explicit.
# The ONNX speaker-embedding model itself is user-supplied (see README).
diarize = [
    "onnxruntime>=1.17.0",
]
# Offline lyric-dataset builder (build_lyric_dataset.py). Needs the `enhance`
# stack too (Demucs vocal separation + torchaudio MMS forced alignment) — torch
# must stay the manually-installed CUDA wheel, so install these with
# `uv pip install ...`, NOT `uv sync --extra dataset`.
dataset = [
    "soundfile>=0.12.1",
    "yt-dlp>=2024.10.0",
    "datasets>=3.0.0",
    "uroman>=1.3.0",
    "imageio-ffmpeg>=0.5.0",
]

[project.scripts]
breeze-elf = "breeze_elf.main:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breeze_elf"]
force-include = { "web" = "breeze_elf/web" }

[tool.pytest.ini_options]
# pytest is a local convenience only (`-k` filtering, nicer diffs) and runs the same
# unittest.TestCase classes. CI is `unittest discover`, which collects NOTHING from
# pytest-style module-level `def test_*` — a file written that way reports green while
# testing nothing. tests/test_web_assets.py enforces this; do not import pytest in tests.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", ".uv-cache", ".hf-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# voice.py embeds a PowerShell script (the Windows WinRT TTS path) as a string
# literal. Its long lines are PowerShell, not Python, and wrapping them means
# editing a Windows-only code path CI cannot run — not worth it for a line
# length. Every E501 in this file is inside that script.
"breeze_elf/voice.py" = ["E501"]
