[project]
name = "breeze-elf"
version = "0.1.0"
description = "Phone microphone streaming over Tailscale to local ASR."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "faster-whisper>=1.1.0",
    "numpy>=1.26.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]
# Neural speech enhancement (DeepFilterNet3) + music source separation (Demucs).
# torch/torchaudio must match the local CUDA — on this RTX 3060 box install with
# the CUDA wheel index first, e.g.:
#   uv pip install torch torchaudio --index-url https://download.pytorch.org/whl/cu124
#   uv pip install deepfilternet demucs
enhance = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "deepfilternet>=0.5.6",
    "demucs>=4.0.1",
]

[project.scripts]
breeze-elf = "breeze_elf.main:run"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["breeze_elf"]
force-include = { "web" = "breeze_elf/web" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".venv", ".uv-cache", ".hf-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
